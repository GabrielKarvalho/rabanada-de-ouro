<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Rabanada de Ouro</title>
<meta name="description" content="Rabanada recheada que continua crocante até a ceia: receitas, embalagem, preço e vendas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--marca:#e9b44c;--marca-forte:#c98a1e;--escuro:#2a1806;--fundo:#120a05;--borda:rgba(255,220,170,.08);--texto-2:#c4b29a;--sucesso:#22c55e;--seguro-topo:env(safe-area-inset-top);--seguro-base:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:#fbf4ea;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.ic{display:block;flex-shrink:0}
.fundo-app{min-height:100dvh;background:radial-gradient(120% 50% at 80% -10%,rgba(201,138,40,.28),transparent 60%),radial-gradient(80% 40% at 0% 0%,rgba(150,70,20,.18),transparent 60%),var(--fundo)}
.tela{max-width:448px;margin:0 auto;padding:max(20px,var(--seguro-topo)) 16px 112px}
.cartao{background:linear-gradient(180deg,rgba(44,29,16,.92),rgba(24,15,8,.92));border:1px solid var(--borda)}
.r-xl{border-radius:12px}.r-2xl{border-radius:16px}
.t2{color:var(--texto-2)}.azul{color:var(--marca)}
.flex{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.entre{justify-content:space-between}.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}.g5{gap:20px}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:20px}.mt6{margin-top:24px}
.f1{flex:1;min-width:0}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sem-scroll{scrollbar-width:none}.sem-scroll::-webkit-scrollbar{display:none}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--borda);background:rgba(20,12,6,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding-bottom:var(--seguro-base)}
.nav ul{max-width:448px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 10px;font-size:13px;color:#d4d4d4}
.nav a.ativo{color:var(--marca);font-weight:600}
/* cabeçalho de página */
.cab{display:flex;align-items:flex-start;gap:12px}
.cab h1{font-size:32px;font-weight:700;line-height:1.15}
.cab p{margin-top:4px;font-size:15px;line-height:1.35;color:var(--texto-2)}
.btn-ic{display:grid;place-items:center;border-radius:999px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:20px -16px 0;padding:0 16px}
.chip{flex-shrink:0;border-radius:999px;padding:10px 20px;font-size:15px;background:rgba(255,255,255,.07);color:#e5e5e5}
.chip.ativo{background:var(--marca);color:var(--escuro);font-weight:500;box-shadow:0 0 16px rgba(233,180,76,.5)}
.campo-busca{width:100%;margin-top:16px;padding:12px 16px;border-radius:12px;outline:none}
.campo-busca:focus{border-color:var(--marca)}
/* progresso */
.barra{height:6px;width:100%;border-radius:999px;background:rgba(255,255,255,.1)}
.barra>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--marca-forte),var(--marca));box-shadow:0 0 8px rgba(233,180,76,.6)}
.anel{position:relative;flex-shrink:0}
.anel span{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700}
/* miniaturas */
.thumb{position:relative;overflow:hidden;background:linear-gradient(135deg,#7a4612,#2e1808 55%,#120a05)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play-redondo{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:999px;background:rgba(0,0,0,.7);display:grid;place-items:center}
/* home */
.logo{display:flex;align-items:center;gap:12px}
.logo-ic{width:48px;height:48px;border-radius:12px;box-shadow:0 0 16px rgba(233,180,76,.35);flex-shrink:0}
.logo-ic .chave{position:absolute;right:-4px;bottom:0;background:var(--fundo);border-radius:999px;padding:2px;color:var(--marca)}
.logo p{font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
.badge{position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:999px;background:#ef4444;font-size:11px;font-weight:700;display:grid;place-items:center}
.hero{position:relative;overflow:hidden;margin-top:20px;border-radius:16px;border:1px solid rgba(233,180,76,.3);padding:20px;background:linear-gradient(120deg,#22120a 0%,#4a2a0e 55%,#1c0f06 100%);box-shadow:0 0 30px rgba(201,138,40,.25)}
.hero .brilho{position:absolute;inset:0;background:radial-gradient(60% 80% at 85% 30%,rgba(245,197,98,.35),transparent 70%)}
.hero .foto{position:absolute;top:0;right:0;height:100%;width:62%;object-fit:cover;object-position:75% 50%}
.hero .fade{position:absolute;top:0;bottom:0;right:30%;width:32%;background:linear-gradient(90deg,#3c210b,transparent)}
.hero .txt{position:relative;max-width:74%}
.hero h2{font-size:25px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero p{margin-top:8px;font-size:15px;line-height:1.35;color:#e5e5e5}
.btn-hero{margin-top:16px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border-radius:999px;background:var(--marca);padding:10px 20px;font-size:15px;font-weight:600;color:var(--escuro);box-shadow:0 0 18px rgba(233,180,76,.6)}
.btn-hero .bola{width:20px;height:20px;border-radius:999px;background:var(--escuro);display:grid;place-items:center;color:var(--marca)}
.recentes{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:0 16px}
.recente{display:flex;gap:8px;width:92%;flex-shrink:0;scroll-snap-align:start}
.recente .thumb{width:58%;aspect-ratio:16/10;border-radius:12px;flex-shrink:0}
.recente .info{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border-radius:12px}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.atalhos a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:12px;text-align:center;font-size:12px;font-weight:500;line-height:1.2}
.ok-verde{color:#fff}
/* aulas / módulos */
.mod{display:flex;gap:12px;padding:10px;border-radius:16px}
.mod .thumb{width:112px;height:96px;border-radius:12px;flex-shrink:0}
.st{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;flex-shrink:0}
.st.ok{background:var(--sucesso)}.st.and{color:var(--escuro);background:var(--marca);box-shadow:0 0 12px rgba(233,180,76,.7)}.st.lock{background:rgba(255,255,255,.1)}
.voltar{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--marca)}
.item-aula{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px}
.num{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-size:14px;font-weight:600;background:rgba(255,255,255,.1);flex-shrink:0}
.num.feito{background:var(--sucesso)}
.player{margin-top:16px;overflow:hidden;border-radius:16px;border:1px solid var(--borda);box-shadow:0 0 30px rgba(201,138,40,.2);aspect-ratio:16/9;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;font-weight:600}
.btn.azul-bg{color:var(--escuro);background:var(--marca);box-shadow:0 0 18px rgba(233,180,76,.5)}
.btn.concluida{background:rgba(34,197,94,.15);color:var(--sucesso)}
/* materiais */
.grade-mat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mat{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 12px 12px;border-radius:16px}
.mat .tit{margin-top:12px;font-size:14.5px;font-weight:600;line-height:1.2}
.mat .baixar{color:var(--escuro);position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:999px;background:var(--marca);display:grid;place-items:center;box-shadow:0 0 12px rgba(233,180,76,.6)}
.trava{margin-top:8px;display:flex;align-items:center;gap:6px;border-radius:999px;background:rgba(233,180,76,.15);padding:4px 10px;font-size:12px;font-weight:600;color:var(--marca)}
.aviso{margin-top:16px;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid rgba(233,180,76,.3);background:rgba(233,180,76,.1);padding:14px;font-size:14px;line-height:1.4}
/* perfil */
.avatar{position:relative;width:64px;height:64px;flex-shrink:0}
.avatar .circ{width:100%;height:100%;border-radius:999px;overflow:hidden;background:#d4d4d4;display:grid;place-items:center}
.avatar .circ img{width:100%;height:100%;object-fit:cover}
.avatar .cam{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:999px;border:2px solid #1a110a;color:var(--escuro);background:var(--marca);display:grid;place-items:center}
.lista-perfil li+li{border-top:1px solid var(--borda)}
.lista-perfil a,.lista-perfil button{width:100%;display:flex;align-items:center;gap:16px;padding:16px;text-align:left;font-size:15px}
.campo-nome{min-width:0;flex:1;border-radius:12px;border:1px solid var(--marca);background:rgba(255,255,255,.05);padding:10px 12px;font-size:17px;outline:none}
/* folha (bottom sheet) */
.folha-fundo{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.folha{width:100%;max-width:448px;margin:0 auto;border-radius:24px 24px 0 0;padding:24px 24px max(24px,var(--seguro-base))}
.folha h2{font-size:20px;font-weight:700}
.btn-claro{background:rgba(255,255,255,.1)}
/* instalar */
.inst-topo{display:flex;align-items:center;gap:14px}
.inst-topo img{width:56px;height:56px;border-radius:14px;box-shadow:0 0 18px rgba(233,180,76,.35);flex-shrink:0}
.passos{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.passo{display:flex;align-items:flex-start;gap:12px;font-size:15px;line-height:1.45}
.passo .n{width:26px;height:26px;border-radius:999px;background:var(--marca);color:var(--escuro);font-size:13px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.chip-ic{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin:0 2px;width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.12);color:var(--marca)}
.seta-baixo{display:flex;justify-content:center;margin-top:14px;color:var(--marca);animation:pulo 1.2s ease-in-out infinite}
@keyframes pulo{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.ib{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:10px 12px;border-radius:14px;border:1px solid var(--marca);background:#2a1a0c}
.ib img{width:36px;height:36px;border-radius:9px;flex-shrink:0}
.ib b{display:block;font-size:14.5px;line-height:1.25}
.ib small{display:block;margin-top:1px;font-size:12px;color:var(--texto-2)}
.ibb{flex-shrink:0;border-radius:12px;background:var(--marca);padding:9px 16px;font-size:13.5px;font-weight:700;color:var(--escuro)}
.ibx{flex-shrink:0;padding:6px;color:var(--texto-2)}
.entrar .ib{margin:0 0 20px}
.lista-inst{margin:12px 0;padding-left:20px;list-style:decimal;line-height:1.8;font-size:15px}
.lista-inst li{padding-left:2px}
.lista-inst .chip-ic{width:24px;height:24px}
.aviso-item{display:flex;gap:12px;padding:14px;border-radius:14px}
.aviso-item .ponto{width:9px;height:9px;border-radius:999px;margin-top:6px;flex-shrink:0;background:transparent}
.aviso-item.novo .ponto{background:var(--marca);box-shadow:0 0 8px rgba(233,180,76,.8)}
.aviso-link{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:14px;font-weight:600;color:var(--marca)}
.cert-preview{margin-top:20px;width:100%;border-radius:12px;box-shadow:0 0 30px rgba(201,138,40,.25);display:block}
.cert-gerando{margin-top:20px;aspect-ratio:1600/1131;border-radius:12px;display:grid;place-items:center;font-size:14px}
.cert-trava{margin-top:24px;padding:24px 20px;border-radius:16px;text-align:center}
.cert-trava .cad{width:64px;height:64px;margin:0 auto;border-radius:999px;display:grid;place-items:center;background:rgba(233,180,76,.15);color:var(--marca)}
/* entrar */
.entrar{position:relative;display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
.entrar .topo{position:absolute;left:0;right:0;top:0;height:52dvh}
.entrar .topo img{width:100%;height:100%;object-fit:cover;object-position:60% 50%;opacity:.85}
.entrar .topo i{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,10,5,.4),rgba(18,10,5,.3) 50%,var(--fundo))}
.entrar .conteudo{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:448px;margin:0 auto;padding:max(24px,var(--seguro-topo)) 24px max(24px,var(--seguro-base))}
.entrar form{margin-top:auto}
.entrar h1{font-size:30px;font-weight:700;line-height:1.2}
.entrar input{width:100%;margin-top:8px;padding:16px;border-radius:16px;font-size:17px;outline:none}
.entrar input:focus{border-color:var(--marca);box-shadow:0 0 0 3px rgba(233,180,76,.25)}
.entrar .btn{margin-top:16px;border-radius:16px;padding:16px;font-size:17px}
.entrar .btn:disabled{opacity:.4;box-shadow:none}
/* capas dos módulos (sem foto) */
.capa{position:absolute;inset:0;display:grid;place-items:center;color:#ffe2a3}
.capa::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 70% at 75% 15%,rgba(255,214,140,.28),transparent 70%)}
.capa .ic{position:relative;z-index:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.capa-n{position:absolute;left:8px;top:8px;z-index:1;border-radius:999px;background:rgba(0,0,0,.45);padding:2px 8px;font-size:11px;font-weight:700;color:#ffe2a3}
.gravando{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px}
.gravando b{font-size:17px}.gravando p{font-size:13.5px;line-height:1.45;color:#e9dccb;max-width:280px}
.selo{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:rgba(233,180,76,.15);padding:4px 10px;font-size:12px;font-weight:600;color:var(--marca)}
</style>
</head>

const { curso, modulos, materiais, avisos } = DADOS;
const todasAulas = modulos.flatMap((m) => m.aulas);
const $app = document.getElementById("app");
const DIA = 864e5;

// ---------- utilidades ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ic(nome, o = {}) {
  const s = o.s ?? 24;
  return `<svg class="ic ${o.cls ?? ""}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${o.fill ? "currentColor" : "none"}" stroke="${o.stroke ?? "currentColor"}" stroke-width="${o.sw ?? 2}" stroke-linecap="round" stroke-linejoin="round"${o.style ? ` style="${o.style}"` : ""}>${ICONES[nome] ?? ""}</svg>`;
}
const duracaoTotal = (min) => { const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h${m ? ` ${m}min` : ""}` : `${m} min`; };
const thumbAula = (a) => (a.youtubeId ? `https://i.ytimg.com/vi/${a.youtubeId}/hqdefault.jpg` : "");
const rotuloMod = (m) => m.rotulo || "Módulo " + m.numero;
function capa(m, estilo = "", grande = false, etiqueta = "") {
  if (m.imagem) return `<div class="thumb" style="${estilo}"><img src="${esc(m.imagem)}" alt="" loading="lazy">${etiqueta ? `<span class="capa-n">${etiqueta}</span>` : ""}</div>`;
  const [c1, c2] = m.cores || ["#7a4612", "#120a05"];
  return `<div class="thumb" style="background:linear-gradient(135deg,${c1},${c2});${estilo}"><div class="capa">${etiqueta ? `<span class="capa-n">${etiqueta}</span>` : ""}${ic(m.icone || "cookie", { s: grande ? 64 : 40, sw: 1.6 })}</div></div>`;
}
function capaAula(a, estilo = "") {
  const m = moduloDaAula(a.slug), n = todasAulas.indexOf(a) + 1;
  return capa(m, estilo, false, `Aula ${n}`);
}
const buscarAula = (slug) => todasAulas.find((a) => a.slug === slug);
const moduloDaAula = (slug) => modulos.find((m) => m.aulas.some((a) => a.slug === slug));
const proximaAula = (slug) => todasAulas[todasAulas.findIndex((a) => a.slug === slug) + 1];
const primeiroNome = (n) => n.trim().split(/\s+/)[0] || "";

// ---------- perfil salvo no aparelho ----------
const CHAVE = "rabanada-ouro:perfil";
const CHAVE_PA = "rabanada-ouro:primeiro-acesso";
function lerPerfil() {
  try {
    const p = JSON.parse(localStorage.getItem(CHAVE) || "null");
    return p && typeof p.nome === "string" ? { concluidas: [], historico: [], ...p } : null;
  } catch { return null; }
}
function gravarPerfil(p, renderizar = true) {
  if (p) localStorage.setItem(CHAVE, JSON.stringify(p)); else localStorage.removeItem(CHAVE);
  if (renderizar) render();
}
function atualizar(mudar, renderizar = true) { const p = lerPerfil(); if (p) gravarPerfil(mudar(p), renderizar); }
function primeiroAcesso(p) {
  let d = localStorage.getItem(CHAVE_PA);
  if (!d || isNaN(Date.parse(d))) { d = p.criadoEm; localStorage.setItem(CHAVE_PA, d); }
  return d;
}
async function prepararFoto(arquivo, lado = 320) {
  const bmp = await createImageBitmap(arquivo);
  const corte = Math.min(bmp.width, bmp.height), t = Math.min(lado, corte);
  const c = document.createElement("canvas"); c.width = c.height = t;
  c.getContext("2d").drawImage(bmp, (bmp.width - corte) / 2, (bmp.height - corte) / 2, corte, corte, 0, 0, t, t);
  bmp.close?.();
  return c.toDataURL("image/jpeg", 0.85);
}

// ---------- progresso ----------
function progressoModulo(m, feitas) {
  const n = m.aulas.filter((a) => feitas.has(a.slug)).length;
  return { feitas: n, total: m.aulas.length, pct: Math.round((n / m.aulas.length) * 100) };
}
function statusModulo(m, feitas) {

  const campo = document.getElementById("nome"), btn = document.getElementById("btn-entrar");
  campo.addEventListener("input", () => { btn.disabled = campo.value.trim().length < 2; });
  document.getElementById("form-entrar").addEventListener("submit", (e) => {
    e.preventDefault();
    const nome = campo.value.trim();
    if (nome.length < 2) return;
    if (!localStorage.getItem(CHAVE_PA)) localStorage.setItem(CHAVE_PA, new Date().toISOString());
    gravarPerfil({ nome, criadoEm: new Date().toISOString(), concluidas: [], historico: [] }, false);
    location.replace("#/");
  });
  setTimeout(() => campo.focus(), 50);
}

// ---------- ações ----------
document.addEventListener("click", (e) => {
  const alvo = e.target.closest("[data-acao]");
  if (!alvo) return;
  if (e.target.closest("[data-parar]") && alvo.classList.contains("folha-fundo")) return;
  const acao = alvo.dataset.acao, v = alvo.dataset.v;
  const alternar = (slug, renderizar) => atualizar((p) => {
    const concluidas = p.concluidas.includes(slug) ? p.concluidas.filter((s) => s !== slug) : [...p.concluidas, slug];
    const tudo = todasAulas.every((a) => concluidas.includes(a.slug));
    return { ...p, concluidas, concluidoEm: tudo ? p.concluidoEm || new Date().toISOString() : p.concluidoEm };
  }, renderizar);
  switch (acao) {
    case "filtro-aulas": ui.filtroAulas = v; render(); break;
    case "busca-aulas": ui.buscaAulas = ui.buscaAulas === null ? "" : null; render(); document.getElementById("busca-aulas")?.focus(); break;
    case "filtro-mat": ui.filtroMat = v; render(); break;
    case "busca-mat": ui.buscaMat = ui.buscaMat === null ? "" : null; render(); document.getElementById("busca-mat")?.focus(); break;
    case "concluir": {
      alternar(v, false);
      document.getElementById("botoes-aula").innerHTML = botoesAula(v, new Set(lerPerfil().concluidas));
      break;
    }
    case "concluir-e-seguir": { const p = lerPerfil(); if (p && !p.concluidas.includes(v)) alternar(v, false); break; }
    case "editar-nome": ui.editandoNome = true; render(); break;
    case "cancelar-nome": ui.editandoNome = false; render(); break;
    case "abrir-foto": ui.folha = "foto"; render(); break;
    case "abrir-sair": ui.folha = "sair"; render(); break;
    case "fechar-folha": ui.folha = null; render(); break;
    case "abrir-avisos": ui.folha = "avisos"; render(); break;
    case "baixar-certificado": baixarCertificado(); break;
    case "compartilhar-certificado": compartilharCertificado(); break;
    case "abrir-instalar":
    case "instalar": {
      const pr = promptInstalar;
      if (!pr) { ui.folha = "instalar"; render(); break; }
      promptInstalar = null;
      pr.prompt();
      pr.userChoice.then((r) => { if (r && r.outcome === "accepted") localStorage.setItem(CHAVE_INSTALAR, "instalado"); render(); }, () => render());
      break;
    }
    case "fechar-cartao-instalar": localStorage.setItem(CHAVE_INSTALAR, String(Date.now())); render(); break;
    case "copiar-link": {
      const link = location.origin + location.pathname;
      const ok = () => { alvo.innerHTML = `${ic("check", { s: 18 })} Link copiado!`; };
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(ok, () => window.prompt("Copie o link:", link));
      else window.prompt("Copie o link:", link);
      break;
    }
    case "escolher-foto": ui.folha = null; render(); document.getElementById("arquivo-foto").click(); break;
    case "remover-foto": ui.folha = null; atualizar(({ foto, ...resto }) => resto); break;
    case "sair": ui.folha = null; localStorage.removeItem(CHAVE); location.replace("#/entrar"); break;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "busca-aulas") { ui.buscaAulas = e.target.value; document.getElementById("lista-modulos").innerHTML = listaModulos(new Set(lerPerfil().concluidas)); }
  if (e.target.id === "busca-mat") { ui.buscaMat = e.target.value; document.getElementById("conteudo-mat").innerHTML = conteudoMateriais(lerPerfil()); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "form-nome") return;
  e.preventDefault();
  const n = document.getElementById("campo-nome").value.trim();
  if (n.length < 2) return;
  ui.editandoNome = false;
  atualizar((p) => ({ ...p, nome: n }));
});
document.getElementById("arquivo-foto").addEventListener("change", async (e) => {
  const arq = e.target.files?.[0];
  e.target.value = "";
  if (!arq) return;
  ui.erroFoto = "";
  try { const foto = await prepararFoto(arq); atualizar((p) => ({ ...p, foto })); }
  catch { ui.erroFoto = "Não foi possível usar essa imagem. Tente outra foto."; render(); }
});
window.addEventListener("hashchange", render);
window.addEventListener("storage", (e) => { if (e.key === CHAVE) render(); });
setInterval(() => { if (rotaAtual().nome === "materiais") { const el = document.getElementById("conteudo-mat"), p = lerPerfil(); if (el && p) el.innerHTML = conteudoMateriais(p); } }, 30000);
render();
</script>
</body>
